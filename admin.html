<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المتجر</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand">لوحة إدارة المتجر ⚙️</div><div class="actions"><button onclick="location.href='index.html'">← المتجر</button><button onclick="logout()">خروج</button></div></header>
<main><div id="loginBox" class="panel" style="max-width:480px;margin:45px auto"><h2>دخول الإدارة</h2><p class="note">أنشئ حسابًا في Supabase Auth ثم استخدم البريد وكلمة المرور هنا.</p><form onsubmit="login(event)"><input id="email" type="email" required placeholder="البريد الإلكتروني"><input id="password" type="password" required placeholder="كلمة المرور"><button class="main-btn" style="width:100%">دخول</button></form><p id="loginMsg"></p></div>
<div id="dashboard" style="display:none"><div class="section-head"><h1>إدارة المتجر</h1><button class="main-btn" onclick="showAdd()">➕ إضافة منتج</button></div><div class="adminnav"><button class="main-btn" onclick="tab('productsTab')">المنتجات</button><button class="main-btn" onclick="tab('ordersTab')">الطلبات</button></div>
<section id="productsTab"><div id="adminProducts" class="grid"></div></section><section id="ordersTab" style="display:none"><div id="orders"></div></section></div></main>
<div id="productModal" class="modal"><div class="panel"><button class="close" onclick="closeP()">×</button><h2 id="formTitle">إضافة منتج</h2><form id="productForm" onsubmit="saveProduct(event)"><input id="pname" required placeholder="اسم المنتج"><input id="pprice" required type="number" min="0" placeholder="السعر بالدينار"><select id="pcat" required></select><textarea id="pdesc" placeholder="وصف المنتج"></textarea><label><b>صور المنتج</b></label><div id="imagePickers"></div><button type="button" class="main-btn" style="width:100%;margin:6px 0 10px" onclick="addImagePicker()">➕ إضافة صورة أخرى</button><small id="imageHint" style="display:block;color:#777;margin:4px 0 10px">يمكنك إضافة الصور واحدةً تلو الأخرى أو اختيار عدة صور إذا كان هاتفك يسمح بذلك.</small><div id="imagePreview" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div><input id="oldimage" type="hidden"><button class="main-btn" style="width:100%">حفظ المنتج</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
