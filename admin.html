<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المتجر | DZMARKAT</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><div class="brand">لوحة إدارة DZMARKAT ⚙️</div><div class="actions"><button type="button" onclick="location.href='index.html'">← المتجر</button><button type="button" onclick="logout()">خروج</button></div></header>
<main>
  <div id="loginBox" class="panel" style="max-width:480px;margin:45px auto">
    <h2>دخول الإدارة</h2><p class="note">سجّل الدخول بحساب الإدارة المفعّل في Supabase.</p>
    <form onsubmit="login(event)"><input id="email" type="email" required autocomplete="username" placeholder="البريد الإلكتروني"><input id="password" type="password" required autocomplete="current-password" placeholder="كلمة المرور"><button type="submit" class="main-btn" style="width:100%">دخول</button></form>
    <p id="loginMsg" role="alert"></p>
  </div>
  <div id="dashboard" style="display:none">
    <div class="section-head"><h1>إدارة المتجر</h1><button type="button" class="main-btn" onclick="showAdd()">➕ إضافة منتج</button></div>
    <div class="adminnav"><button type="button" class="main-btn" onclick="tab('productsTab')">المنتجات</button><button type="button" class="main-btn" onclick="tab('ordersTab')">الطلبات</button></div>
    <section id="productsTab"><div id="adminProducts" class="grid"></div></section>
    <section id="ordersTab" style="display:none"><div id="orders"></div></section>
  </div>
</main>
<div id="productModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <div class="panel"><button type="button" class="close" onclick="closeP()" aria-label="إغلاق">×</button><h2 id="formTitle">إضافة منتج</h2>
    <form id="productForm" onsubmit="saveProduct(event)">
      <input id="pname" required maxlength="180" placeholder="اسم المنتج">
      <input id="pprice" required type="number" min="0" step="0.01" placeholder="السعر بالدينار">
      <select id="pcat" required></select>
      <textarea id="pdesc" maxlength="4000" placeholder="وصف المنتج"></textarea>
      <label><b>صور المنتج</b></label><div id="imagePickers"></div>
      <button type="button" class="main-btn" style="width:100%;margin:6px 0 10px" onclick="addImagePicker()">➕ إضافة حقل صور</button>
      <small style="display:block;color:#777;margin:4px 0 10px">يمكنك اختيار عدة صور من الهاتف، وتظهر الصور المحفوظة قبل إضافة صور أخرى.</small>
      <div id="imagePreview"></div><input id="oldimage" type="hidden">
      <button type="submit" class="main-btn" style="width:100%">حفظ المنتج</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
